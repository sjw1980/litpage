<!doctype html>
<html lang="en" class="lit-html">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Litpage</title>
    <script>
      // crypto.randomUUID polyfill for insecure contexts (plain http on a LAN/Tailscale IP):
      // the Web Crypto UUID API exists only in secure contexts, but getRandomValues is everywhere.
      // Must be a classic script in <head>: it runs before any module's top-level code.
      (function () {
        var c = window.crypto;
        if (c && typeof c.randomUUID !== 'function') {
          c.randomUUID = function () {
            var b = new Uint8Array(16);
            c.getRandomValues(b);
            b[6] = (b[6] & 0x0f) | 0x40;
            b[8] = (b[8] & 0x3f) | 0x80;
            var hex = Array.prototype.map.call(b, function (x) { return x.toString(16).padStart(2, '0'); }).join('');
            return hex.slice(0, 8) + '-' + hex.slice(8, 12) + '-' + hex.slice(12, 16) + '-' + hex.slice(16, 20) + '-' + hex.slice(20);
          };
        }
      })();
    </script>
    <script>
      // Apply theme before first paint (the appearance choice is stored per device).
      (function () {
        try {
          var pref = localStorage.getItem('nc:theme') || 'system';
          var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.add(dark ? 'lit-dark-theme' : 'lit-light-theme');
        } catch (e) { document.documentElement.classList.add('lit-light-theme'); }
      })();
    </script>
  </head>
  <body class="lit-body">
    <div id="lit-app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
